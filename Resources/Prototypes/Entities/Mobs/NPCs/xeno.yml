# Hacky for the stress test so don't even consider adding to this

- type: entity
  name: MobXenoBase
  id: MobXenoBase
  abstract: true
  category: [ HideSpawnMenu ]
  parent: [ SimpleSpaceMobBase, MobVentCritter ] # Den: add MobVentCritter
  suffix: Xeno
  description: They mostly come at night. Mostly.
  components:
  - type: Xeno
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -1.5
      groups:
        Brute: -1.5
  - type: Insulated
  - type: CombatMode
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: XenoCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 3 # DeltaV - Was 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: NpcFactionMember
    factions:
    - Xeno
  - type: ComplexInteraction
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Mobs/Xenos/burrower.rsi  # DeltaV - Port RMC Sprites
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: running
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 1000
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobState
  - type: Deathgasp
    prototype: XenoDeathgasp
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Critical
      350: Dead # DeltaV - Was 50
  - type: SlowOnDamage
    speedModifierThresholds:
      75: 0.8
      125: 0.5
      200: 0.3
  - type: Stamina
    critThreshold: 200
  - type: Bloodstream
    bloodReagent: FluorosulfuricAcid
    maxBleedAmount: 1
    bloodMaxVolume: 50
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    soundHit:
     collection: AlienClaw
    animation: WeaponArcBite
    damage:
# Begin DeltaV Changes
      types:
        Slash: 12
        Structural: 35
# End DeltaV Changes
  - type: DamageStateVisuals
    rotate: true
    states:
      Alive:
        Base: running
      Critical:
        Base: crit
      Dead:
        Base: dead
  - type: Puller
    needsHands: false
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-xeno-name
    description: ghost-role-information-xeno-description
    rules: ghost-role-information-xeno-rules
    mindRoles:
      - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short
  - type: GhostTakeoverAvailable
  - type: TypingIndicator
    proto: alien
  - type: Temperature
    heatDamageThreshold: 360
    coldDamageThreshold: -150
    currentTemperature: 310.15
  - type: Tag
    tags:
      - CannotSuicide
      - DoorBumpOpener
      - FootstepSound
      - XenoEmotes
  - type: NoSlip
  - type: Perishable #Ummmm the acid kills a lot of the bacteria or something
    molsPerSecondPerUnitMass: 0.0005
  - type: Speech
    speechVerb: LargeMob
    speechSounds: Xenonid # DeltaV: Use RMC's speech sounds for sentient xenos
  - type: Psionic
    removable: false
    roller: false
  - type: InnatePsionicPowers
    powersToAdd:
      - TelepathyPower
  - type: LanguageKnowledge
    speaks:
    - Xeno
    understands:
    - Xeno
  - type: ThermalVision
    lightRadius: 7
    drawOverlay: false
    color: "#d70aa0"
  - type: NightVision # Den
    drawOverlay: false
    activateSound: null
    deactivateSound: false
    color: "#808080"
  - type: Fauna # Lavaland Change
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 800
      behaviors:
      - !type:GibBehavior { }

- type: entity
  name: MobXenoSpitterBase
  id: MobXenoSpitterBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.75
  - type: BasicEntityAmmoProvider
    proto: BulletAcid
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 1 # DeltaV - was 0.75
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/Weapons/Xeno/alien_spitacid.ogg

- type: entity
  name: Burrower
  id: MobXeno
  parent: MobXenoBase

